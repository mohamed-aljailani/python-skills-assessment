<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور | Python Skills Academy</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a5f);
    }

    .card {
      background: white;
      width: 100%;
      max-width: 460px;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(0,0,0,.2);
    }

    h1 { color: #142b4b; text-align: center; font-size: 25px; }

    p { color: #475569; line-height: 1.8; text-align: center; }

    label { display: block; margin: 18px 0 8px; font-weight: bold; }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #166534;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: not-allowed; }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      background: #f1f5f9;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🔐 إعادة تعيين كلمة المرور</h1>

    <p>Python Skills Academy</p>

    <div id="message">جارٍ التحقق من رابط الاستعادة...</div>

    <form id="resetForm" hidden>
      <label for="password">كلمة المرور الجديدة</label>
      <input
        type="password"
        id="password"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input
        type="password"
        id="confirmPassword"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="submitButton">
        حفظ كلمة المرور الجديدة
      </button>
    </form>
  </div>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://gmxjwgacpygorqwyfeoo.supabase.co",
      "sb_publishable_4sB0pFunm7YFIPN-sGODVg_3vnSvTQp",
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: false,
          autoRefreshToken: false
        }
      }
    );

    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitButton");

    let recoveryVerified = false;

    function showMessage(text) {
      message.textContent = text;
    }

    async function checkRecovery() {
      try {
        const url = new URL(window.location.href);
        const code = url.searchParams.get("code");
        const tokenHash = url.searchParams.get("token_hash");
        const type = url.searchParams.get("type");

        let recoveryError = null;

        if (code) {
          const result = await supabase.auth.exchangeCodeForSession(code);
          recoveryError = result.error;
        } else if (tokenHash && type === "recovery") {
          const result = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: "recovery"
          });
          recoveryError = result.error;
        }

        if (recoveryError) {
          throw recoveryError;
        }

        const { data, error } = await supabase.auth.getSession();

        if (error || !data.session) {
          showMessage(
            "رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا."
          );
          return;
        }

        recoveryVerified = true;
        form.hidden = false;
        showMessage("تم التحقق من الرابط. أدخل كلمة المرور الجديدة.");

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

      } catch (error) {
        showMessage(
          "تعذر التحقق من رابط الاستعادة. اطلب رابطًا جديدًا."
        );
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryVerified) return;

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        showMessage("كلمتا المرور غير متطابقتين.");
        return;
      }

      if (password.length < 12) {
        showMessage("يجب أن تتكون كلمة المرور من 12 حرفًا على الأقل.");
        return;
      }

      button.disabled = true;
      showMessage("جارٍ تحديث كلمة المرور...");

      const { error } = await supabase.auth.updateUser({
        password
      });

      if (error) {
        showMessage("تعذر تحديث كلمة المرور. حاول مرة أخرى.");
        button.disabled = false;
        return;
      }

      await supabase.auth.signOut({ scope: "local" });

      form.hidden = true;
      showMessage(
        "✅ تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة."
      );
    });

    checkRecovery();
  </script>
</body>
</html>
