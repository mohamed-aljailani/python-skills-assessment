<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Skills Assessment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 45px 30px;
            border-radius: 22px;
            text-align: center;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.2);
        }

        h1 {
            color: #142b4b;
            font-size: 30px;
        }

        p {
            color: #475569;
            font-size: 18px;
            line-height: 1.9;
        }

        .badge {
            display: inline-block;
            background: #e0f2fe;
            color: #075985;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
        }

        .courses {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .course {
            background: #f1f5f9;
            padding: 12px 20px;
            border-radius: 12px;
            color: #1e293b;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="badge">Python Skills Academy</div>

        <h1>🐍 تقييم مهارات البرمجة بلغة Python</h1>

        <p>
            مرحبًا بك في منصة تقييم المهارات البرمجية.
            <br>
            نعمل على تجهيز تجربة تعليمية تساعد الطلاب
            على اكتشاف مستوياتهم وتطوير مهاراتهم.
        </p>

        <div class="courses">
            <div class="course">TECH107</div>
            <div class="course">TECH108</div>
            <div class="course">TECH221</div>
        </div>

        <p>🚀 المنصة قيد التطوير</p>
    </div>

</body>
</html>
